<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Bearbeiten</title>
    <link rel="stylesheet" href="/styles/edit-item/style.css">
</head>
<body>
<div class="edit-form-container">
    <h1 class="header">Bearbeiten</h1>
    <form method="post" th:action="@{'/dashboard/editItem/' + ${product.id}}">
        <label for="productName">Produktname:</label>
        <input id="productName" name="productName" class="form-control" required th:value="${product.productName}">
        <label for="shelfNumber">Regalnummer:</label>
        <input id="shelfNumber" name="shelfNumber" class="form-control" required th:value="${product.shelfNumber}">
        <label for="stock">Menge:</label>
        <input id="stock" name="stock" type="number" class="form-control" th:value="${product.stock}">
        <label for="price">Preis:</label>
        <input id="price" name="price" type="number" step="0.01" class="form-control" th:value="${product.price}">
        <label for="deliveryTime">Lieferdatum:</label>
        <input id="deliveryTime" name="deliveryTime" type="datetime-local" class="form-control"
               th:value="${#temporals.format(product.deliveryTime, 'yyyy-MM-dd') + 'T' + #temporals.format(product.deliveryTime, 'HH:mm')}">
        <label for="seller">Verkäufer:</label>
        <input id="seller" name="seller" class="form-control" th:value="${product.seller}">
        <div class="submit-container">
            <button type="submit" class="btn btn-success mt-3 w-100">Speichern</button>
        </div>
    </form>
</div>
</body>
</html>
